name: Rules and updater checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Build Windows update helper
        run: dotnet build tools/updater/Updater.csproj -c Release
      - name: Check repository and plugin layout
        run: python3 tools/check_layout.py
      - name: Verify Workshop and manual package contracts
        run: |
          python3 -m pip install Pillow==12.3.0
          python3 -m unittest discover -s tests/Layout -v
      - name: Run independent rule and update tests
        run: |
          dotnet run --project tests/Uno/EngineTests.csproj
          dotnet run --project tests/Shared/SharedTests.csproj
          dotnet run --project tests/CardAndArcade/SecondTests.csproj
          dotnet run --project tests/Gomoku/GomokuTests.csproj
          dotnet run --project tests/Bubble/BubbleTests.csproj
          dotnet run --project tests/Retro/RetroTests.csproj
          dotnet run --project tests/Mahjong/MahjongTests.csproj
          dotnet run --project tests/Tuning/TuningTests.csproj
          dotnet run --project tests/Updater/UpdateTests.csproj
          dotnet run --project tests/Sanguosha/Sanguosha.Tests.csproj
